name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mirror:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: herdr-rc-mirror-linux-x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: herdr-rc-mirror-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: herdr-rc-mirror-darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: herdr-rc-mirror-darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --manifest-path vendor/herdr-mirror/Cargo.toml --target ${{ matrix.target }}
      - run: cp vendor/herdr-mirror/target/${{ matrix.target }}/release/herdr-mirror ${{ matrix.asset }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - run: shasum -a 256 herdr-rc-mirror-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            herdr-rc-mirror-*
            SHA256SUMS
