id = "hope7happiness.herdr-web"
name = "herdr-web"
version = "0.6.0"
min_herdr_version = "0.7.0"
description = "Mobile-first web UI: drive your agents from a phone browser"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "install", "--no-fund", "--no-audit"]

[[build]]
command = ["bash", "scripts/install-vendored-mirror.sh"]

# Startup hooks are one-shot (not supervised daemons) — this one ensures the
# bridge server is running and exits. See scripts/plugin-start.sh.
[[startup]]
command = ["bash", "scripts/plugin-start.sh"]

[[actions]]
id = "start"
title = "Start herdr-web server"
contexts = ["workspace"]
command = ["bash", "scripts/plugin-start.sh"]

[[actions]]
id = "stop"
title = "Stop herdr-web server"
contexts = ["workspace"]
command = ["bash", "scripts/plugin-stop.sh"]

[[actions]]
id = "tailscale-serve"
title = "Set up phone RC with Tailscale"
contexts = ["workspace"]
command = ["bash", "scripts/tailscale.sh", "serve"]

[[actions]]
id = "tailscale-status"
title = "Show herdr-web Tailscale status"
contexts = ["workspace"]
command = ["bash", "scripts/tailscale.sh", "status"]

[[actions]]
id = "tailscale-stop"
title = "Stop herdr-web Tailscale listener"
contexts = ["workspace"]
command = ["bash", "scripts/tailscale.sh", "off"]

[[actions]]
id = "mirror-start"
title = "Remote workspaces: start / resume"
command = ["./vendor/herdr-mirror/target/release/herdr-mirror", "start"]

[[actions]]
id = "mirror-pause"
title = "Remote workspaces: pause"
command = ["./vendor/herdr-mirror/target/release/herdr-mirror", "pause"]

[[actions]]
id = "mirror-status"
title = "Remote workspaces: status"
command = ["./vendor/herdr-mirror/target/release/herdr-mirror", "status"]

[[actions]]
id = "mirror-remote-new-workspace"
title = "Remote workspaces: new workspace"
command = ["./vendor/herdr-mirror/target/release/herdr-mirror", "remote-workspace"]

[[actions]]
id = "mirror-remote-new-tab"
title = "Remote workspaces: new tab"
command = ["./vendor/herdr-mirror/target/release/herdr-mirror", "remote-tab"]

[[actions]]
id = "mirror-remote-split-right"
title = "Remote workspaces: split right"
command = ["./vendor/herdr-mirror/target/release/herdr-mirror", "remote-split", "right"]

[[actions]]
id = "mirror-remote-split-down"
title = "Remote workspaces: split down"
command = ["./vendor/herdr-mirror/target/release/herdr-mirror", "remote-split", "down"]

[[events]]
on = "workspace.focused"
command = ["./vendor/herdr-mirror/target/release/herdr-mirror", "ensure"]
